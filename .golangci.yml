# golangci-lint configuration for DeepPool
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  # Timeout for analysis
  timeout: 5m
  # Use Go workspace mode
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # Core correctness
    - govet
    - staticcheck
    - unused
    - ineffassign
    # Bug detection
    - bodyclose
    - nilerr

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  govet:
    enable-all: true
    disable:
      - inline

formatters-settings:
  goimports:
    local-prefixes: deeppool

issues:
  # Exclude generated/third-party code
  exclude-dirs:
    - generated
    - vendor
    - node_modules
    - dist
    - build
  exclude-dirs-use-default: false
  exclude-rules:
    # Allow unused params in test files
    - path: _test\.go
      linters:
        - unused
    # Skip node_modules (npm packages that contain Go files)
    - path: node_modules/
      linters:
        - govet
        - staticcheck
        - unused
        - ineffassign
        - bodyclose
        - nilerr
  # Maximum issues per linter (0 = unlimited)
  max-issues-per-linter: 0
  max-same-issues: 0
