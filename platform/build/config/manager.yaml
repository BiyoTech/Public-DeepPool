server:
  addr: ":8080"
  grpc_addr: ":9090"
  tls:
    enabled: true
    cert_file: "/etc/letsencrypt/live/test.deeppool.tech/fullchain.pem"
    key_file: "/etc/letsencrypt/live/test.deeppool.tech/privkey.pem"
    skip_verify: false

log:
  level: "info"

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "root@123"
  database: "deeppool"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime_minutes: 30

# Stream-level liveness timeouts shared with NodeManager. Applied to:
#   - Gateway Provider SSE
#   - Gateway gRPC stream to NodeManager
#   - NodeManager DispatchStream (DeepNode chunk channel)
# 0 means "use code default" (10s / 20s).
stream_timeouts:
  first_token_timeout_seconds: 10
  inter_chunk_idle_timeout_seconds: 20

admin:
