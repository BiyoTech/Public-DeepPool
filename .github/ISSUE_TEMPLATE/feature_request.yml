name: Feature Request
description: Suggest a new feature or enhancement for DeepPool
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for your feature suggestion! Please describe your idea in detail.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component does this feature relate to?
      options:
        - Platform Backend (Manager)
        - Platform Backend (NodeManager)
        - Platform Backend (Experiment)
        - Gateway (Inference Routing)
        - Guardrails
        - Trace / AI Evaluation
        - Admin Dashboard (control_web)
        - User Portal (portal_web)
        - DeepNode Desktop Client
        - DeepNode LocalServer (Python)
        - Protobuf / gRPC
        - Build / Deployment / CI
        - Documentation
        - New Component
        - Other
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What kind of improvement is this?
      options:
        - New Feature
        - Enhancement of Existing Feature
        - Performance Improvement
        - Developer Experience (DX)
        - Security Improvement
        - Documentation Improvement
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the motivation?
      placeholder: "I'm frustrated when ... / Currently there is no way to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or behavior you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and feature requests for duplicates.
          required: true
        - label: I am willing to submit a PR to implement this feature.
          required: false
