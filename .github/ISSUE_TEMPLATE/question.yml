name: Question / Discussion
description: Ask a question about usage, architecture, or development of DeepPool
title: "[Question]: "
labels: ["question"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Have a question about DeepPool? Please check the [README](https://github.com/BiyoTech/Public-DeepPool/blob/main/README.md) and existing issues first.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: What is this question about?
      options:
        - Setup / Installation
        - Configuration
        - API Usage (OpenAI-compatible)
        - Gateway Routing / Hybrid Policies
        - Guardrails
        - Tracing / AI Evaluation
        - DeepNode Client
        - Local Inference (MLX / vLLM / llama.cpp)
        - Deployment
        - Architecture / Design
        - Contributing / Development
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Describe your question in detail.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide any additional context — what you've tried, error messages, environment info, etc.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have read the README and documentation.
          required: true
        - label: I have searched existing issues for similar questions.
          required: true
