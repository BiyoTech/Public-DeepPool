name: Bug Report
description: Report a bug or unexpected behavior in DeepPool
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below to help us investigate.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Platform Backend (Manager)
        - Platform Backend (NodeManager)
        - Platform Backend (Experiment)
        - Gateway (Inference Routing)
        - Guardrails
        - Trace / AI Evaluation
        - Admin Dashboard (control_web)
        - User Portal (portal_web)
        - DeepNode Desktop Client
        - DeepNode LocalServer (Python)
        - Protobuf / gRPC
        - Build / Deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide detailed steps to reproduce the issue.
      placeholder: |
        1. Start Manager service with `./run_platformserver.sh manager`
        2. Send a request to `POST /v1/chat/completions` with ...
        3. Observe the error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or logs if available.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details.
      value: |
        - OS: [e.g., macOS 15.1, Ubuntu 22.04]
        - Go version: [e.g., 1.23.x]
        - Node.js version: [e.g., 18.x]
        - Python version: [e.g., 3.13.x]
        - MySQL version: [e.g., 8.0.x]
        - Browser (if frontend issue): [e.g., Chrome 120]
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output (please redact sensitive info such as API keys).
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have included relevant logs / error messages.
          required: false
